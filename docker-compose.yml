version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oceanx_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - oceanx_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oceanx_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=postgresql://oceanx:oceanx_dev@db:5432/oceanx
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oceanx_net

  db:
    image: postgis/postgis:17-3.5
    container_name: oceanx_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: oceanx_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanx -d oceanx"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oceanx_net

  redis:
    image: redis:7-alpine
    container_name: oceanx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oceanx_net

volumes:
  pgdata:

networks:
  oceanx_net:
    driver: bridge
