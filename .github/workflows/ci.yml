name: OCEAN-X CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Python & API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Baseline Datasets
        run: |
          python scripts/generate_sample_data.py

      - name: Run Backend Integration Tests
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              r = client.get('/api/health')
              assert r.status_code == 200, f'Health check failed: {r.status_code}'
              r = client.get('/api/model/info')
              assert r.status_code == 200, f'Model info failed: {r.status_code}'
              r = client.get('/api/model/slice?variable=thetao&depth=0&time_index=0')
              assert r.status_code == 200, f'Model slice failed: {r.status_code}'
              r = client.get('/api/observations/all')
              assert r.status_code == 200, f'Observations all failed: {r.status_code}'
              r = client.get('/api/analytics/heat-potential')
              assert r.status_code == 200, f'Heat potential failed: {r.status_code}'
              print('All CI automated tests passed successfully!')
          "
